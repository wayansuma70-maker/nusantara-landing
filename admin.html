<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard Pemilik — Nusantara Digital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F2D3A'/%3E%3Cpath d='M32 14c9 8 12 17 0 36C20 31 23 22 32 14z' fill='%23E8805E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css?v=1.0">
</head>
<body>

<!-- ===== MASUK ===== -->
<section class="login" id="login">
  <div class="login-card">
    <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3c4 3 5 7 0 15C7 10 8 6 12 3z" fill="currentColor"/></svg></span><span>Dashboard Pemilik</span></div>
    <p class="muted">Masuk dengan akun Google yang terdaftar sebagai pengelola.</p>
    <div id="gbtn" class="gbtn"></div>
    <p class="err" id="loginInfo" hidden></p>
    <form id="darForm" class="dar" hidden autocomplete="off">
      <div class="div"><span>Akses darurat</span></div>
      <label class="fld"><span>Nama pengguna</span><input id="darUser" autocomplete="username" required></label>
      <label class="fld"><span>Kata sandi</span><input id="darPass" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-block" type="submit">Masuk</button>
    </form>
    <p class="sm muted">Halaman ini hanya untuk pemilik produk. <a href="index.html">← Kembali ke halaman penjualan</a></p>
  </div>
</section>

<!-- ===== APLIKASI ===== -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3c4 3 5 7 0 15C7 10 8 6 12 3z" fill="currentColor"/></svg></span><div><b>Nusantara</b><small>OWNER PORTAL</small></div></div>
    <nav>
      <small class="nav-t">MANAJEMEN</small>
      <button data-go="ringkasan" class="on"><svg class="ic"><use href="#d-grid"/></svg>Ringkasan</button>
      <button data-go="leads"><svg class="ic"><use href="#d-users"/></svg>Data Leads <i class="cnt" id="cntLeads" hidden></i></button>
      <button data-go="crm"><svg class="ic"><use href="#d-book"/></svg>CRM Kontak</button>
      <button data-go="produk" data-owner><svg class="ic"><use href="#d-box"/></svg>Produk &amp; Video</button>
      <button data-go="wa"><svg class="ic"><use href="#d-send"/></svg>WhatsApp &amp; Notifikasi</button>
      <button data-go="pengaturan"><svg class="ic"><use href="#d-sliders"/></svg>Pengaturan Konten</button>
      <button data-go="migrasi" data-owner><svg class="ic"><use href="#d-db"/></svg>Migrasi Data</button>
    </nav>
    <div class="side-foot">
      <div class="status"><i></i> Landing page aktif</div>
      <a href="index.html" target="_blank" rel="noopener"><svg class="ic"><use href="#d-link"/></svg>Lihat halaman penjualan</a>
      <button id="btnLogout"><svg class="ic"><use href="#d-out"/></svg>Keluar</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="Menu"><svg class="ic"><use href="#d-menu"/></svg></button>
      <div class="top-t"><span class="pill ok">OWNER VIEW</span><h1 id="pageTitle">Ringkasan</h1></div>
      <div class="top-r"><span class="cache" id="cacheInfo" hidden></span><div class="who"><b id="whoName">-</b><small id="whoRole">-</small></div></div>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
  </div>
</div>

<div class="drawer" id="drawer" hidden><div class="drawer-bg" data-x></div><aside class="drawer-card"><button class="x" data-x aria-label="Tutup">✕</button><div id="drawerBody"></div></aside></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="d-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="d-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.4c2.2.7 3.5 2.6 3.5 5.6"/></symbol>
  <symbol id="d-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6M9 12h6"/></symbol>
  <symbol id="d-send" viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></symbol>
  <symbol id="d-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="d-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  <symbol id="d-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="d-out" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></symbol>
  <symbol id="d-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="d-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
</defs></svg>

<script src="js/config.js?v=1.0"></script>
<script src="js/api.js?v=1.0"></script>
<script src="js/admin.js?v=1.0"></script>
</body>
</html>
